<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Otázka ❤️</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffb6c1, #ffe4e1);
    }

    .container {
        text-align: center;
        margin-top: 120px;
    }

    h1 {
        font-size: 50px;
        color: #d1005c;
    }

    button {
        padding: 15px 35px;
        font-size: 22px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.2s;
    }

    #yes {
        background: #4CAF50;
        color: white;
        margin-right: 20px;
    }

    #no {
        background: #f44336;
        color: white;
        position: absolute;
        left: calc(50% + 60px);
        top: 250px;
    }

    #message {
        margin-top: 40px;
        font-size: 35px;
        color: #d1005c;
        font-weight: bold;
    }
</style>

</head>
<body>

<div class="container">
    <h1>❤️ Miluješ ma? ❤️</h1>

    <button id="yes">Áno</button>
    <button id="no">Nie</button>

    <div id="message"></div>
</div>

<script>
const noBtn = document.getElementById("no");

function moveButton() {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("click", function(e) {
    e.preventDefault();
    moveButton();
});

document.getElementById("yes").addEventListener("click", function() {
    document.getElementById("message").innerHTML =
        "🥰 Vedel som to! ❤️ Aj ja teba! 💖";
});
</script>

</body>
</html>
